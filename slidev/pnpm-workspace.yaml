
# `playwright-chromium` is needed for `slidev export` (PDF/PNG/PPTX) and has a
# postinstall script that downloads the browser. pnpm v11 errors on unapproved
# build scripts by default (`strictDepBuilds: true`), so allowlist it up-front.
allowBuilds:
  playwright-chromium: true
minimumReleaseAge: 0
shamefullyHoist: true

# Don't auto-run `pnpm install` before `pnpm run <script>`. Slidev is invoked
# via its local binary inside build:pages, so the pre-run deps check only gets
# in the way — and on machines with a `minimumReleaseAge` supply-chain policy it
# fails outright when the lockfile pins a just-published transitive dependency.
verifyDepsBeforeRun: false
